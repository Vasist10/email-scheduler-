# ─────────────────────────────────────────────────────────────────────────────
# Email Scheduler — Production Docker Compose
#
# Services
#   postgres        PostgreSQL 16 — primary data store
#   redis           Redis 7       — BullMQ job queue + rate-limit counters
#   elasticsearch   ES 8          — full-text email search (single-node)
#   backend         Express API + Prisma (port 4000)
#   worker          BullMQ email worker (same image, different CMD)
#   frontend        Vite build served by nginx (port 80)
#
# Usage
#   1. cp Backend/.env.example Backend/.env   # fill in real secrets
#   2. docker compose up -d
#   3. docker compose exec backend npm run migrate
#
# All stateful data lives in named volumes so containers can be
# stopped / recreated without data loss.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-email_scheduler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-email_scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes   # AOF persistence
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      # Single-node mode — no cluster formation needed
      discovery.type:               single-node
      # Disable TLS/auth for local/internal use (backend talks over Docker network)
      xpack.security.enabled:       "false"
      # JVM heap — half of the container's memory limit (1 GB here)
      ES_JAVA_OPTS:                 "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s   # ES takes longer to start than other services
    # Memory limit — prevents ES from consuming all host RAM
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: email-scheduler-backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      # Override localhost hostnames with Docker service names
      REDIS_HOST:          redis
      REDIS_PORT:          "6379"
      ELASTICSEARCH_URL:   http://elasticsearch:9200
      # DATABASE_URL must be set in .env; the service name replaces the host:
      # postgresql://postgres:postgres@postgres:5432/email_scheduler
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Run DB migration then start the server
    command: >
      sh -c "npm run migrate && node dist/server.js"

  worker:
    # Reuses the same compiled image — only the CMD differs
    image: email-scheduler-backend
    restart: unless-stopped
    env_file: ./Backend/.env
    environment:
      REDIS_HOST:        redis
      REDIS_PORT:        "6379"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      # Wait for the backend service so migrations always run first
      backend:
        condition: service_healthy
    command: ["node", "dist/workers/email.worker.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the backend directly, so this must be the
        # publicly reachable URL — not the Docker internal hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

# ── Named Volumes ────────────────────────────────────────────────────────────
# Data persists across `docker compose down` (removed only with --volumes flag).

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
